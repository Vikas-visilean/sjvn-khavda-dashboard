name: Refresh dashboard

on:
  push:
    branches: [main]
  schedule:
    # every 2 hours — keeps the published data fresh for the Refresh button
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build dashboard from live VisiLean API
        run: node build-dashboard.js
        env:
          VL_TASKS_URL: ${{ secrets.VL_TASKS_URL }}
          VL_CONSTRAINTS_URL: ${{ secrets.VL_CONSTRAINTS_URL }}
      - name: Stage site
        run: mkdir -p _site && cp index.html _site/index.html && cp -r fonts _site/fonts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
